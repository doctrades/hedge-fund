<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="description" content="Full trade-by-trade performance log for the Doc Trades Hedge Fund." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="performance">

  <div id="site-header"></div>

  <main>
    <section class="hero" style="padding-bottom: 10px;">
      <div class="wrap">
        <span class="eyebrow"><span class="dot"></span>Trade by trade</span>

        <div class="trade-list" id="trade-timeline"></div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div data-component="calculator"></div>
      </div>
    </section>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
